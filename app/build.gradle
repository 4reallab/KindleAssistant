plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kindle.assistant'
    compileSdk 34

    defaultConfig {
        // 迁移用途：用 -PmigrationAppId 临时覆盖安装标识（namespace 不动，组件类名照旧）。
        applicationId project.findProperty('migrationAppId') ?: 'com.kindle.assistant'
        minSdk 27
        targetSdk 27
        versionCode 1
        versionName '1.0'
    }

    // 签名凭据不随仓库分发：优先 local.properties，其次环境变量。
    def signingProps = new Properties()
    def signingPropsFile = rootProject.file('local.properties')
    if (signingPropsFile.exists()) {
        signingProps.load(new FileInputStream(signingPropsFile))
    }
    def signingStoreFile = signingProps.getProperty('signing.storeFile')
            ?: System.getenv('SIGNING_STORE_FILE')
    def signingStorePassword = signingProps.getProperty('signing.storePassword')
            ?: System.getenv('SIGNING_STORE_PASSWORD')
    def signingKeyAlias = signingProps.getProperty('signing.keyAlias')
            ?: System.getenv('SIGNING_KEY_ALIAS')
    def signingKeyPassword = signingProps.getProperty('signing.keyPassword')
            ?: System.getenv('SIGNING_KEY_PASSWORD')

    signingConfigs {
        release {
            if (signingStoreFile) {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // 迁移用途：-PmigrationDebug 时打开 debuggable，便于 run-as 读写私有数据。
            debuggable project.hasProperty('migrationDebug')
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            if (variant.buildType.name == 'release') {
                output.outputFileName = 'KindleAssistant.apk'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
